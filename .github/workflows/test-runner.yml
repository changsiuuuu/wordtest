name: 🚀 Self-hosted Runner Test

on: 
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: self-hosted 
    
    steps:
      - name: 1. 접속된 서버의 호스트네임 확인
        run: hostname
        
      - name: 2. 실행 중인 사용자 계정 확인
        run: whoami
        
      - name: 3. 현재 작업 경로 확인
        run: pwd
        
      - name: 4. 축하 메시지 출력
        run: echo "🎉 완벽합니다! 이 코드는 창수 님의 mgmt 서버(Rocky Linux)에서 실행되었습니다!"
